org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Where the Shelfsight backend runs. 10.0.2.2 is your computer, as seen from the Android emulator.
# On a physical phone, use your computer's LAN IP, e.g. http://192.168.1.20:8001/ (include the port and the trailing slash)
shelfscan.serverUrl=http://192.168.0.176:8001/
# The app token is a secret and this file is public: put it in android/local.properties (git-ignored) as
#   shelfscan.appToken=<same value as APP_TOKEN on the server>
# Values in local.properties override this file (shelfscan.serverUrl too).
