name: Task / feature
description: Something to build or change. Fill in acceptance criteria so it can be picked up.
labels: ["feature"]
projects: ["TheEmpatheticProgrammer/1"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why are we doing this? What problem does it solve for the user?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist. The ticket is done when every box is true.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Anything that should NOT be done in this ticket.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: ["p1 - do next", "p2 - soon", "p3 - whenever"]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, links, screenshots
